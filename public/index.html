<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mega88 - Upload Media</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="header">
    <div class="logo">🚀 <span>Mega88</span></div>
    <div class="badge">UNLIMITED DISK!</div>
  </div>
  <div class="container">
    <div class="upload-card" id="dropZone">
      <div class="upload-icon">📤</div>
      <h2>DROP YOUR FILES HERE</h2>
      <p class="sub-text">Gambar · Video · Muzik · Dokumen</p>
      <p class="sub-text" style="font-size:12px; color:#888;">Maksimum 4.5MB</p>
      <div class="upload-actions">
        <button class="btn-primary" id="browseBtn">📁 CLICK TO BROWSE</button>
        <input type="file" id="fileInput" hidden>
      </div>
      <div class="progress-container" id="progressContainer" style="display:none;">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
        </div>
        <span class="progress-text" id="progressText">0%</span>
      </div>
      <div class="result-container" id="resultContainer" style="display:none;">
        <div class="result-success">
          <span>✅</span>
          <strong>UPLOAD SUCCESSFUL!</strong>
        </div>
        <div class="result-link">
          <input type="text" id="resultUrl" readonly>
          <button class="btn-copy" id="copyBtn">📋 Copy</button>
        </div>
        <button class="btn-upload-more" id="uploadMoreBtn">Upload Lagi</button>
      </div>
    </div>
    <div class="footer">
       <p>© 2024 - 2026 LuppY7cofee • No ExpireD • Unlimited</p>
       <p class="credit">Built with 🎀 By NaQiBcodE dev</p>
    </div>
  </div>
  <script src="/script.js"></script>
</body>
</html>
